<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f2b48" />
      <stop offset="100%" stop-color="#080e1e" />
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="emeraldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="4" stroke-dasharray="16 12" />

  <!-- Central Map Pin / Airflow Core -->
  <g filter="url(#glow)">
    <!-- Upper Wind Stream (Emerald) -->
    <path d="M 120 180 Q 240 140 330 180 T 400 170" fill="none" stroke="url(#emeraldLine)" stroke-width="22" stroke-linecap="round" />
    
    <!-- Main Center Wind Stream (Cyan) -->
    <path d="M 100 256 Q 220 210 320 256 T 420 250" fill="none" stroke="url(#cyanLine)" stroke-width="28" stroke-linecap="round" />
    
    <!-- Lower Wind Stream (Amber/Teal) -->
    <path d="M 140 332 Q 250 290 320 332 T 390 325" fill="none" stroke="#fbbf24" stroke-width="20" stroke-linecap="round" />

    <!-- Pulse Beacon Pin in Center -->
    <circle cx="260" cy="256" r="42" fill="#0f172a" stroke="#38bdf8" stroke-width="12" />
    <circle cx="260" cy="256" r="18" fill="#10b981" />
  </g>
</svg>
